  <!-- Top Face Grid Detail -->
  <line x1="20" y1="12.5" x2="44" y2="25.5" stroke="#C7D2FE" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="44" y1="12.5" x2="20" y2="25.5" stroke="#C7D2FE" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Center 3D Axis Node -->
  <circle cx="32" cy="19" r="3" fill="#EEF2FF"/>
  <!-- Monitor screen on isometric plane -->
