<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" fill="none">
  <!-- Flaticon Minimalist Dark Tech Canvas -->
  <rect width="880" height="200" rx="16" fill="#0F0C1B"/>
  <rect x="1" y="1" width="878" height="198" rx="15" stroke="#2D224D" stroke-width="2"/>

  <!-- Left Flaticon Octopus Vector -->
  <g transform="translate(40, 24)">
    <!-- Glow Backing -->
    <circle cx="76" cy="76" r="64" fill="#7C3AED" opacity="0.12"/>
    
    <!-- Octopus Head -->
    <circle cx="76" cy="62" r="44" fill="#6D28D9"/>
    <path d="M32 62C32 37.699 51.699 18 76 18C100.301 18 120 37.699 120 62V74C120 90.569 106.569 104 90 104H62C45.431 104 32 90.569 32 74V62Z" fill="#7C3AED"/>
    
    <!-- Head Specular -->
    <path d="M48 38C54 28 64 22 76 22C79 22 82 22.5 85 23.5C72 26 58 35 52 48C50 44 49 41 48 38Z" fill="#C4B5FD" opacity="0.6"/>

    <!-- Eyes -->
    <circle cx="60" cy="64" r="11" fill="#FFFFFF"/>
    <circle cx="92" cy="64" r="11" fill="#FFFFFF"/>
    <circle cx="62" cy="64" r="5.5" fill="#1E1B4B"/>
    <circle cx="90" cy="64" r="5.5" fill="#1E1B4B"/>
    <circle cx="64" cy="62" r="2" fill="#FFFFFF"/>
    <circle cx="92" cy="62" r="2" fill="#FFFFFF"/>

    <!-- Smile -->
    <path d="M71 82C73.5 84.5 78.5 84.5 81 82" stroke="#311042" stroke-width="3" stroke-linecap="round"/>

    <!-- 8 Flat Tentacles -->
    <path d="M36 88C24 98 16 114 20 128C23.5 138 34 133 34 121C34 109 43 101 48 96" fill="none" stroke="#6D28D9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M50 94C45 106 40 121 50 133C56 140 65 135 63 123C61 111 65 104 68 97" fill="none" stroke="#7C3AED" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M84 97C87 104 91 111 89 123C87 135 96 140 102 133C112 121 107 106 102 94" fill="none" stroke="#7C3AED" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M104 96C109 101 118 109 118 121C118 133 128.5 138 132 128C136 114 128 98 116 88" fill="none" stroke="#6D28D9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M32 74C18 83 9 97 13 111C16.5 120 27 118 27 108C27 96 34 86 41 81" fill="none" stroke="#5B21B6" stroke-width="6" stroke-linecap="round"/>
    <path d="M120 74C134 83 143 97 139 111C135.5 120 125 118 125 108C125 96 118 86 111 81" fill="none" stroke="#5B21B6" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Typography & Flat Vector Badges -->
  <g transform="translate(225, 0)">
    <!-- Pill Category Badge -->
    <g transform="translate(0, 32)">
      <rect width="180" height="24" rx="12" fill="#2E1065" stroke="#6D28D9" stroke-width="1.2"/>
      <circle cx="14" cy="12" r="3.5" fill="#10B981"/>
      <text x="26" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#DDD6FE" letter-spacing="1">3D AGENT WORKFORCE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
      OCTO <tspan fill="#A78BFA">AGENT</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="500" fill="#94A3B8">
      Autonomous AI Agents Connected to 3D Model Creation &amp; 3D Virtual Workspace
    </text>

    <!-- 3 Core Package Flat Badges -->
    <g transform="translate(0, 144)">
      <!-- 1. Agent 3D Studio -->
      <g>
        <rect width="185" height="28" rx="6" fill="#1E1B4B" stroke="#4338CA" stroke-width="1"/>
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#C7D2FE">Agent 3D Studio</text>
        <text x="142" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="500" fill="#818CF8">:3000</text>
      </g>
      <!-- 2. Octo Core Engine -->
      <g transform="translate(195, 0)">
        <rect width="185" height="28" rx="6" fill="#064E3B" stroke="#059669" stroke-width="1"/>
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#A7F3D0">Octo Core Engine</text>
        <text x="126" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="500" fill="#34D399">Sandbox</text>
      </g>
      <!-- 3. Chief 3D Mascot -->
      <g transform="translate(390, 0)">
        <rect width="185" height="28" rx="6" fill="#3B0764" stroke="#7E22CE" stroke-width="1"/>
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#F3E8FF">Chief 3D Mascot</text>
        <text x="142" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="500" fill="#C084FC">WebGL</text>
      </g>
    </g>
  </g>
</svg>
