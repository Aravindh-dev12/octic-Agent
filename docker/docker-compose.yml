version: '3.8'

services:
  # Optional legacy dashboard/bot stack (requires the compatibility integration).
  claw:
    profiles: ["claw"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.claw
    volumes:
      - claw_data:/data
    ports:
      - "8082:8082"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/health" ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - praison_network

  # ─── Optional legacy integration services ─────────────────────────────

  # Optional legacy UI service
  ui:
    profiles: ["legacy"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.ui
    volumes:
      - praison_data:/root/.praison
      - .:/app
    ports:
      - "8082:8082"
    environment:
      FLASK_ENV: development
      CHAINLIT_PORT: "8082"
      CHAINLIT_HOST: "0.0.0.0"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CHAINLIT_AUTH_SECRET: ${CHAINLIT_AUTH_SECRET}
      PRAISON_CONFIG_DIR: /root/.praison
      CHAINLIT_CONFIG_DIR: /root/.praison
      CHAINLIT_DB_DIR: /root/.praison
    command: praisonai ui --host 0.0.0.0
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - praison_network

  # Optional legacy chat service
  chat:
    profiles: ["legacy"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.chat
    volumes:
      - praison_data:/root/.praison
      - .:/app
    ports:
      - "8083:8083"
    environment:
      CHAINLIT_PORT: "8083"
      CHAINLIT_HOST: "0.0.0.0"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CHAINLIT_AUTH_SECRET: ${CHAINLIT_AUTH_SECRET}
      PRAISON_CONFIG_DIR: /root/.praison
      CHAINLIT_CONFIG_DIR: /root/.praison
      CHAINLIT_DB_DIR: /root/.praison
    command: praisonai chat --host 0.0.0.0 --port 8083
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8083" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - praison_network

  # Octic AI Agent API
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in your environment}
      OCTIC_AI_AGENT_API_TOKEN: ${OCTIC_AI_AGENT_API_TOKEN:?Set OCTIC_AI_AGENT_API_TOKEN in your environment}
      OCTIC_AI_AGENT_API_HOST: 0.0.0.0
      OCTIC_AI_AGENT_API_PORT: "8080"
      OCTIC_AI_AGENT_API_AUTH: "enabled"
      OCTIC_AI_AGENT_WORKSPACE: /workspace
    volumes:
      - ${OCTIC_AGENT_WORKSPACE_PATH:-../workspace}:/workspace:rw
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - praison_network

  # Optional legacy agents service
  agents:
    profiles: ["legacy"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.praisonaiagents
    volumes:
      - praison_data:/root/.praison
      - ./examples:/app/examples
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PRAISON_CONFIG_DIR: /root/.praison
    networks:
      - praison_network
  # For bot services (Slack, Discord, Telegram), see docker/bots/

volumes:
  claw_data:
    driver: local
  praison_data:
    driver: local

networks:
  praison_network:
    driver: bridge
