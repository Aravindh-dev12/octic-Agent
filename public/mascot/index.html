<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Purple Octopus</title>
<style>
  :root{--bg:#f5f1fc}
  @media (prefers-color-scheme: dark){:root{--bg:#120c24}}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #msg{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;
    font:15px ui-sans-serif,system-ui,sans-serif;color:#8a7cc0;pointer-events:none;transition:opacity .6s}
  #msg.done{opacity:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg">Waking the octopus…</div>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const msg = document.getElementById('msg');
const canvas = document.getElementById('c');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true }); }
catch(e){ msg.textContent = 'This page needs WebGL to show the 3D octopus.'; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 200);
camera.position.set(0, 0.5, 21);

scene.add(new THREE.HemisphereLight(0xcdbfff, 0x3a2a70, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(5, 9, 10); scene.add(key);
const rim = new THREE.DirectionalLight(0xff9ae6, 1.6); rim.position.set(-8, 3, -6); scene.add(rim);

const rig = new THREE.Group(); scene.add(rig);

// ---- eye + arm shader uniforms ----
const EYES = [ new THREE.Vector2(238/800, 408/800), new THREE.Vector2(308/800, 452/800) ];
const EYE_R = 0.026;                         // eye radius in texture (uv) space
const U = {
  uTime:{value:0},
  uHead:{value:new THREE.Vector3(-4.5, 6.5, 5.0)},   // where the arms start (mesh space)
  uEye0:{value:EYES[0]}, uEye1:{value:EYES[1]}, uEyeR:{value:EYE_R},
  uLook0:{value:new THREE.Vector2()}, uLook1:{value:new THREE.Vector2()},
  uOpen:{value:1}
};

let mesh = null, eyeVerts = [[],[]];

fetch('octopus.wasm').then(r => r.arrayBuffer())
 .then(buf => new Promise((res, rej) => new GLTFLoader().parse(buf, '', res, rej)))
 .then(gltf => {
  const octo = gltf.scene;
  mesh = octo.getObjectByProperty('isMesh', true);
  octo.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(octo);
  const size = box.getSize(new THREE.Vector3()), ctr = box.getCenter(new THREE.Vector3());
  const s = 14 / Math.max(size.x, size.y, size.z);
  octo.scale.setScalar(s);
  octo.position.sub(ctr.multiplyScalar(s));
  rig.add(octo);

  // vertices around each eye (used to map mouse direction -> pupil offset in uv space)
  const g = mesh.geometry, pos = g.attributes.position, uv = g.attributes.uv;
  for (let i = 0; i < pos.count; i++) {
    for (let e = 0; e < 2; e++) {
      if (Math.hypot(uv.getX(i)-EYES[e].x, uv.getY(i)-EYES[e].y) < 0.07)
        eyeVerts[e].push(new THREE.Vector3().fromBufferAttribute(pos, i), new THREE.Vector2(uv.getX(i), uv.getY(i)));
    }
  }

  // ---- split the mesh into its 8 arms (+ mantle) and give every vertex its position along its arm ----
  {
    const head = U.uHead.value, R = 5.5;
    const idx = g.index.array, n = pos.count;
    const weld = new Map(), wid = new Int32Array(n);
    for (let i = 0; i < n; i++) {
      const k = Math.round(pos.getX(i)*1000)+','+Math.round(pos.getY(i)*1000)+','+Math.round(pos.getZ(i)*1000);
      if (!weld.has(k)) weld.set(k, weld.size);
      wid[i] = weld.get(k);
    }
    const par = new Int32Array(weld.size).map((_, i) => i);
    const find = x => { while (par[x] !== x) { par[x] = par[par[x]]; x = par[x]; } return x; };
    const dist = new Float32Array(n), v3 = new THREE.Vector3();
    for (let i = 0; i < n; i++) dist[i] = v3.fromBufferAttribute(pos, i).distanceTo(head);
    for (let t = 0; t < idx.length; t += 3) {
      const a = idx[t], b = idx[t+1], c = idx[t+2];
      if (dist[a] > R && dist[b] > R) par[find(wid[a])] = find(wid[b]);
      if (dist[b] > R && dist[c] > R) par[find(wid[b])] = find(wid[c]);
      if (dist[a] > R && dist[c] > R) par[find(wid[a])] = find(wid[c]);
    }
    const comps = new Map();
    for (let i = 0; i < n; i++) if (dist[i] > R) {
      const r = find(wid[i]);
      if (!comps.has(r)) comps.set(r, { n:0, maxd:0, sy:0 });
      const c = comps.get(r); c.n++; c.sy += pos.getY(i); c.maxd = Math.max(c.maxd, dist[i]);
    }
    let mantle = -1, best = -1e9, k = 0;
    for (const [r, c] of comps) { if (c.n < 100) continue; const my = c.sy/c.n; if (my > best) { best = my; mantle = r; } }
    const arms = []; for (const [r, c] of comps) if (c.n >= 100 && r !== mantle) arms.push(r);
    const aT = new Float32Array(n), aArm = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      if (dist[i] <= R) continue;
      const r = find(wid[i]); if (r === mantle) continue;
      const ai = arms.indexOf(r); if (ai < 0) continue;
      const c = comps.get(r);
      aT[i] = Math.min(1, (dist[i]-R) / (c.maxd-R));
      aArm[i] = (ai+1) * 2.399;               // different phase for every arm (golden angle)
    }
    g.setAttribute('aT', new THREE.BufferAttribute(aT, 1));
    g.setAttribute('aArm', new THREE.BufferAttribute(aArm, 1));
    console.log('arms found:', arms.length);
  }

  const m = mesh.material;
  m.side = THREE.DoubleSide; m.roughness = 0.55; m.envMapIntensity = 0.9;
  m.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, U);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
        attribute float aT; attribute float aArm;
        uniform float uTime; uniform vec3 uHead;`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        {
          vec3 d = position - uHead;
          float t = aT;
          float ph = uTime*2.6 - t*3.2 + aArm;
          float a = t*t*1.5 + t*0.3;
          transformed.x += sin(ph) * a;
          transformed.z += sin(ph + 2.1) * a;
          transformed.y += sin(ph*0.8 + 4.2) * a * 0.6;
          transformed += d * sin(uTime*1.4) * 0.012 * (1.0 - smoothstep(0.0, 0.3, t));
        }`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        uniform vec2 uEye0,uEye1,uLook0,uLook1; uniform float uEyeR,uOpen;
        vec3 eyePaint(vec3 base, vec3 skin, vec2 uvp, vec2 c, vec2 look){
          vec2 q = uvp - c;
          float rr = uEyeR;
          // cover the painted dot with skin colour
          float cover = 1.0 - smoothstep(rr*1.15, rr*1.45, length(q));
          base = mix(base, skin, cover);
          // eyeball (squashes vertically when blinking)
          vec2 qe = vec2(q.x, q.y / max(uOpen, 0.04));
          float ball = 1.0 - smoothstep(rr*0.92, rr*1.0, length(qe));
          vec3 col = vec3(0.93,0.93,0.98);
          // pupil follows look offset (look is in uv space)
          vec2 qp = vec2(q.x - look.x, (q.y - look.y)) ; qp.y /= max(uOpen,0.04);
          float pupil = 1.0 - smoothstep(rr*0.40, rr*0.48, length(qp));
          col = mix(col, vec3(0.02,0.01,0.04), pupil);
          float hl = 1.0 - smoothstep(rr*0.10, rr*0.16, length(qp - vec2(-rr*0.16, -rr*0.16)));
          col = mix(col, vec3(1.0), hl*pupil);
          // soft shadow ring at the edge of the eye
          col *= mix(0.78, 1.0, smoothstep(rr*1.0, rr*0.6, length(qe)));
          return mix(base, col, ball * step(0.06, uOpen));
        }`)
      .replace('#include <map_fragment>', `#include <map_fragment>
        {
          vec3 skin0 = texture2D(map, uEye0 + vec2(-0.045, 0.0)).rgb;
          vec3 skin1 = texture2D(map, uEye1 + vec2(-0.045, 0.0)).rgb;
          diffuseColor.rgb = eyePaint(diffuseColor.rgb, skin0, vMapUv, uEye0, uLook0);
          diffuseColor.rgb = eyePaint(diffuseColor.rgb, skin1, vMapUv, uEye1, uLook1);
        }`);
  };
  msg.classList.add('done');
}).catch(err => { msg.textContent = 'Could not load the model.'; console.error(err); });

// ---- mouse for the eyes ----
const mouse = new THREE.Vector2(0.2, 0.1); let lastMove = -99;
addEventListener('pointermove', e => { mouse.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight*2-1)); lastMove = performance.now()/1000; });

function resize(){
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth/innerHeight;
  camera.fov = innerWidth/innerHeight < 0.8 ? 52 : 38;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const look = [new THREE.Vector2(), new THREE.Vector2()];
const tmp = new THREE.Vector3();
function updateEyes(t, now){
  if (!mesh) return;
  // target point on screen: the mouse, or a wandering gaze when the mouse is idle
  const idle = now - lastMove > 3;
  const tx = idle ? Math.sin(t*0.9)*0.7 : mouse.x, ty = idle ? Math.sin(t*1.3+1)*0.35 : mouse.y;
  for (let e = 0; e < 2; e++) {
    const v = eyeVerts[e]; if (v.length < 6) continue;
    // least-squares fit  screen = A*uv + b   (uv->screen jacobian)
    let n=0, mu=0, mv=0, mx=0, my=0; const pts=[];
    for (let i=0;i<v.length;i+=2){ tmp.copy(v[i]).applyMatrix4(mesh.matrixWorld).project(camera); pts.push([v[i+1].x, v[i+1].y, tmp.x, tmp.y]); mu+=v[i+1].x; mv+=v[i+1].y; mx+=tmp.x; my+=tmp.y; n++; }
    mu/=n; mv/=n; mx/=n; my/=n;
    let suu=0,suv=0,svv=0,sux=0,svx=0,suy=0,svy=0;
    for (const p of pts){ const du=p[0]-mu, dv=p[1]-mv, dx=p[2]-mx, dy=p[3]-my; suu+=du*du; suv+=du*dv; svv+=dv*dv; sux+=du*dx; svx+=dv*dx; suy+=du*dy; svy+=dv*dy; }
    const det = suu*svv - suv*suv; if (Math.abs(det) < 1e-12) continue;
    // A = [[ax,bx],[ay,by]] with dx = ax*du + bx*dv
    const ax = (sux*svv - svx*suv)/det, bx = (svx*suu - sux*suv)/det;
    const ay = (suy*svv - svy*suv)/det, by = (svy*suu - suy*suv)/det;
    // eye centre on screen
    const cu = EYES[e].x - mu, cv = EYES[e].y - mv;
    const ex = mx + ax*cu + bx*cv, ey = my + ay*cu + by*cv;
    let sx = tx - ex, sy = ty - ey; const sl = Math.hypot(sx, sy) || 1;
    const k = Math.min(1, sl*1.6); sx = sx/sl*k; sy = sy/sl*k;       // unit-ish screen direction
    // invert A to get uv direction
    const dA = ax*by - bx*ay; if (Math.abs(dA) < 1e-9) continue;
    let du = ( by*sx - bx*sy)/dA, dv = (-ay*sx + ax*sy)/dA;
    const l = Math.hypot(du, dv) || 1; const mag = EYE_R*0.5*k;
    du = du/l*mag; dv = dv/l*mag;
    look[e].lerp(new THREE.Vector2(du, dv), 0.2);
  }
  U.uLook0.value.copy(look[0]); U.uLook1.value.copy(look[1]);
}

let nextBlink = 1.5, blinkT = -1;
function updateBlink(t){
  if (blinkT < 0 && t > nextBlink) blinkT = 0;
  if (blinkT >= 0) {
    blinkT += 1/60;
    const k = blinkT/0.18;
    U.uOpen.value = k < 1 ? 1 - Math.sin(k*Math.PI) : 1;
    if (k >= 1) { blinkT = -1; U.uOpen.value = 1; nextBlink = t + 1.5 + Math.random()*3.5; }
  }
}

const clock = new THREE.Clock(); let t = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05); t += dt;
  U.uTime.value = t;
  // automatic turn: the face (+x side of the model) swings left and right toward the viewer
  rig.rotation.y = -Math.PI/2 + Math.sin(t*0.5)*0.8;
  rig.rotation.x = Math.sin(t*0.45)*0.07;
  rig.rotation.z = Math.sin(t*0.6)*0.05;
  rig.position.set(Math.sin(t*0.4)*0.8, Math.sin(t*0.8)*0.6, 0);
  camera.lookAt(0, 0, 0);
  rig.updateMatrixWorld(true); camera.updateMatrixWorld(true);
  updateEyes(t, performance.now()/1000);
  updateBlink(t);
  renderer.render(scene, camera);
});
</script>
</body>
</html>

</body></html>
